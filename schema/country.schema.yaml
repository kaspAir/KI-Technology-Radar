$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "country.schema.yaml"
title: Country
description: >-
  Jurisdiktion einer Instanz bzw. eines Länder-Radars (A1). Land ist
  Konfiguration, kein Schema-Eigenname (E24-Linie): der Kern bleibt neutral, die
  Instanz trägt genau eine Jurisdiktion. Dasselbe Schema validiert die einzelne
  Instanz-Konfiguration (country.yaml) und die Einträge des Länder-Manifests
  (countries.yaml) für den Umschalter.
type: object
additionalProperties: false
required: [code, label]
properties:
  code:
    description: "ISO 3166-1 alpha-2 (z.B. CH, LI, DE)"
    type: string
    pattern: "^[A-Z]{2}$"
  label:
    type: string
    minLength: 1
  flag:
    description: "Emoji-Flagge, optional"
    type: string
  url:
    description: "URL des Länder-Radars (nur im Manifest)"
    type: string
    format: uri
  status:
    description: "active = deployt und wählbar; planned = vorgesehen"
    enum: [active, planned]
