$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "observation.schema.yaml"
title: Observation
description: >-
  Datierter Beleg. Keine Aussage ohne Quelle (E8): citation ist Pflicht.
  Sicherheitsgrad explizit (E16). status trennt Eingangskorb von Geltung (E20).
type: object
additionalProperties: false
required: [id, source_ids, title, summary, citation, confidence, status, created_by]
properties:
  id:
    type: string
    pattern: "^obs\\.[a-z0-9-]+$"
  radar_entry_id:
    description: "null solange im Eingangskorb; gesetzt sobald verlinkt"
    type: [string, "null"]
    pattern: "^entry\\.[a-z0-9-]+$"
  source_ids:
    type: array
    minItems: 1
    items:
      type: string
      pattern: "^source\\.[a-z0-9-]+$"
  title:
    type: string
    minLength: 1
  summary:
    type: string
    description: "2–3 Sätze"
    minLength: 1
  citation:
    type: string
    description: "Quelle/Zitat — Pflicht (E8)"
    minLength: 1
  confidence:
    enum: [confirmed, likely, rumored]
  status:
    enum: [inbox, linked, discarded]
  date_published:
    type: string
    format: date
  date_observed:
    type: string
    format: date
  created_by:
    type: string
    description: "ki:<modell> | mensch:<name>"
    pattern: "^(ki|mensch):.+$"
