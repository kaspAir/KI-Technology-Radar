$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "source.schema.yaml"
title: Source
description: "Kuratierte Quelle (E6). Lebt in der Instanz — verrät, worauf die Organisation schaut."
type: object
additionalProperties: false
required: [id, name, type, trust_level, cadence]
properties:
  id:
    type: string
    pattern: "^source\\.[a-z0-9-]+$"
  name:
    type: string
    minLength: 1
  type:
    enum: [research, vendor, product, regulator, community]
  url:
    type: string
    format: uri
  trust_level:
    enum: [high, medium, low]
  cadence:
    enum: [weekly, monthly]
  ingest:
    description: "Automatischer Abruf durch den Ingestion-Agenten (optional). Ohne = nur manuell."
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        enum: [arxiv, feed]
      query:
        type: string
        description: "arXiv-Suchausdruck (nur type=arxiv)"
      feed:
        type: string
        format: uri
        description: "RSS/Atom-Feed-URL (nur type=feed)"
