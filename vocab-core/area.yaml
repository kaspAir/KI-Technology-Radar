  - {id: area.recht-regulatorik,  taxonomy: area, label: "Recht & Regulatorik", status: active, since: 2026-07-10}
  - {id: area.markt-praxis,       taxonomy: area, label: "Markt & Praxis",      status: active, since: 2026-07-10}
  - {id: area.non-technical,      taxonomy: area, label: "Non-Technical",       status: active, since: 2026-07-10}
