<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KI-Technology-Radar</title>
  <style>
    :root {
      --gold: #C0851F;   /* Aletheia-Gold */
      --ink:  #23262D;   /* Tinte */
      --paper:#F8F6F2;   /* Papier */
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--ink);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; min-height: 100%;
    }
    .card {
      width: 100%; max-width: 560px; text-align: center;
    }
    .mark { width: 96px; height: 96px; margin: 0 auto 20px; display: block; }
    .signature {
      font-size: 12px; letter-spacing: 0.35em; text-transform: uppercase;
      color: var(--gold); margin: 0 0 2px;
    }
    h1 {
      font-size: 40px; font-weight: 650; margin: 0 0 14px; letter-spacing: -0.01em;
    }
    .tagline {
      font-size: 16px; line-height: 1.5; color: #cfcbc3; margin: 0 auto 28px; max-width: 420px;
    }
    .env {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(248,246,242,0.25); border-radius: 999px;
      padding: 7px 16px; font-size: 13px; letter-spacing: 0.06em;
    }
    .env .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); }
    .status {
      margin-top: 28px; font-size: 14px; color: #a7a39b; line-height: 1.6;
    }
    .status strong { color: var(--paper); font-weight: 600; }
    footer {
      margin-top: 40px; font-size: 12px; color: #6f6c66; letter-spacing: 0.04em;
    }
    @media (max-width: 420px) { h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <main class="card">
    <!-- Radar-Marke (radar-solid): Scheibe, Horizont, Kern, aufsteigender Blip -->
    <svg class="mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="Radar">
      <circle cx="60" cy="60" r="54" fill="#C0851F"></circle>
      <line x1="24" y1="84" x2="96" y2="84" stroke="#F8F6F2" stroke-width="4.5" stroke-linecap="round"></line>
      <circle cx="52" cy="62" r="10" fill="none" stroke="#F8F6F2" stroke-width="4.5"></circle>
      <circle cx="82" cy="40" r="6" fill="#F8F6F2"></circle>
    </svg>

    <p class="signature">Aletheia</p>
    <h1>Radar</h1>
    <p class="tagline">Neues am Horizont erkennen, bevor es alle sehen.</p>

    <span class="env"><span class="dot"></span><span id="env-label">Umgebung</span></span>

    <p class="status">
      <strong>Aufbauphase · Release R1</strong><br>
      Schema, Vokabular und Bewertung stehen. Die interaktive Radar-Ansicht
      folgt in einem späteren Release.
    </p>

    <footer>KI-Technology-Radar · Phronesis</footer>
  </main>

  <script>
    // Umgebung aus der Subdomain ableiten (dev./test./int. — sonst prod).
    (function () {
      var h = location.hostname;
      var env = "prod";
      if (h.indexOf("dev.") === 0) env = "dev";
      else if (h.indexOf("test.") === 0) env = "test";
      else if (h.indexOf("int.") === 0) env = "int";
      var labels = { dev: "Entwicklung (dev)", test: "Test", int: "Integration (int)", prod: "Produktion" };
      document.getElementById("env-label").textContent = labels[env];
      document.title = "KI-Technology-Radar · " + labels[env];
    })();
  </script>
</body>
</html>
